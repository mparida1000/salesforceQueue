# .github/workflows/salesforce-deploy.yml
name: 🚀 Salesforce Deployment Queue

on:
  pull_request:
    types: [closed]
    branches: [dev, main, master]

# QUEUE CONFIGURATION
concurrency:
  group: sfdc-prod-deploy-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: 🔍 Setup & Validate
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check-changes.outputs.has_changes }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      
      - name: 🔧 Setup Salesforce CLI
        uses: salesforceactions/setup-sfdx@v4
      
      - name: 🔍 Check for Salesforce Changes
        id: check-changes
        run: |
          BASE_COMMIT=${{ github.event.pull_request.base.sha }}
          HEAD_COMMIT=${{ github.event.pull_request.merge_commit_sha }}
          
          # Check for any Salesforce metadata files
          if git diff --name-only $BASE_COMMIT..$HEAD_COMMIT | grep -qE '\.(cls|trigger|page|component|object|layout|profile|permissionset)$'; then
            echo "Salesforce changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No Salesforce changes"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 📊 Queue Status
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            // Create initial queue comment
            const comment = `## ⏳ Salesforce Deployment Queue
            
            **PR #${{ github.event.pull_request.number }}** added to deployment queue.
            
            👤 **Requested by:** ${{ github.actor }}
            🔗 **View queue:** https://github.com/${{ github.repository }}/actions/workflows/${{ github.workflow }}
            
            This deployment will start automatically when previous deployments complete.
            `;
            
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ github.event.pull_request.number }},
                body: comment
              });
            } catch (error) {
              console.log('Could not create comment');
            }

  deploy:
    name: 🚀 Deploy to Salesforce
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.has_changes == 'true'
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      
      - name: 🔧 Setup Salesforce CLI
        uses: salesforceactions/setup-sfdx@v4
      
      - name: 🔐 Authenticate to Salesforce
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SF_USERNAME: ${{ secrets.SF_PROD_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
        run: |
          echo "$SF_JWT_KEY" | base64 -d > server.key
          sfdx auth:jwt:grant \
            --clientid $SF_CONSUMER_KEY \
            --jwtkeyfile server.key \
            --username $SF_USERNAME \
            --instanceurl $SF_INSTANCE_URL \
            --setalias prod-org
      
      - name: 📝 Prepare Delta Deployment
        run: |
          BASE_COMMIT=${{ github.event.pull_request.base.sha }}
          HEAD_COMMIT=${{ github.event.pull_request.merge_commit_sha }}
          
          # Get list of changed Salesforce files
          CHANGED_FILES=$(git diff --name-only $BASE_COMMIT..$HEAD_COMMIT)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Filter for Salesforce files and create deployment directory
          mkdir -p deploy-package
          
          # Copy changed Salesforce files
          for file in $CHANGED_FILES; do
            if [[ $file =~ \.(cls|trigger|page|component|object|layout|profile|permissionset)$ ]] && [ -f "$file" ]; then
              mkdir -p "deploy-package/$(dirname "$file")"
              cp "$file" "deploy-package/$file"
              echo "Added: $file"
            fi
          done
          
          # Create package.xml if we have files
          if [ -n "$(find deploy-package -type f -name '*.cls' -o -name '*.trigger' -o -name '*.page' -o -name '*.component')" ]; then
            cat > deploy-package/package.xml << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<Package xmlns="http://soap.sforce.com/2006/04/metadata">
  <types>
    <members>*</members>
    <name>ApexClass</name>
  </types>
  <types>
    <members>*</members>
    <name>ApexTrigger</name>
  </types>
  <types>
    <members>*</members>
    <name>ApexPage</name>
  </types>
  <types>
    <members>*</members>
    <name>ApexComponent</name>
  </types>
  <types>
    <members>*</members>
    <name>CustomObject</name>
  </types>
  <types>
    <members>*</members>
    <name>Layout</name>
  </types>
  <types>
    <members>*</members>
    <name>Profile</name>
  </types>
  <types>
    <members>*</members>
    <name>PermissionSet</name>
  </types>
  <version>58.0</version>
</Package>
EOF
            echo "Created package.xml"
          fi
      
      - name: 🚀 Deploy Changes
        id: deployment
        run: |
          if [ ! -d "deploy-package" ] || [ -z "$(ls -A deploy-package 2>/dev/null)" ]; then
            echo "No files to deploy"
            echo "status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Deploying Salesforce changes..."
          
          # Deploy using SFDX
          sfdx force:source:deploy \
            --sourcepath deploy-package \
            --wait 30 \
            --testlevel RunLocalTests \
            --targetusername ${{ secrets.SF_PROD_USERNAME }} \
            --json > deploy-result.json
          
          # Check deployment result
          if jq -e '.status == 0' deploy-result.json > /dev/null 2>&1; then
            echo "✅ Deployment successful!"
            echo "status=success" >> $GITHUB_OUTPUT
            
            # Get deployment details
            DEPLOYMENT_ID=$(jq -r '.result.id' deploy-result.json)
            echo "Deployment ID: $DEPLOYMENT_ID"
          else
            echo "❌ Deployment failed"
            cat deploy-result.json
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: 📨 Update PR Status
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const status = '${{ steps.deployment.outputs.status }}';
            const emoji = status === 'success' ? '✅' : status === 'skipped' ? '⚠️' : '❌';
            
            const comment = `## ${emoji} Deployment ${status}
            
            **PR #${{ github.event.pull_request.number }}** deployment completed.
            
            **Status:** ${status.toUpperCase()}
            **By:** ${{ github.actor }}
            **Time:** ${new Date().toLocaleString()}
            
            ${status === 'success' ? 'Changes deployed to Salesforce successfully!' :
             status === 'skipped' ? 'No Salesforce changes to deploy.' :
             'Deployment failed. Check workflow logs for details.'}
            `;
            
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ github.event.pull_request.number }},
                body: comment
              });
            } catch (error) {
              console.log('Could not update PR');
            }
      
      - name: 🧹 Cleanup
        if: always()
        run: rm -rf deploy-package server.key deploy-result.json
