name: Deploy Apex (Queued)

on:
  pull_request:
    types: [closed]
    branches: [dev]

env:
  SF_USERNAME: ${{ secrets.SF_PROD_USERNAME }}
  SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
  SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
  SF_SERVER_KEY: ${{ secrets.SF_JWT_KEY }}

  REDIS_HOST: ${{ secrets.REDIS_HOST }}
  REDIS_PORT: ${{ secrets.REDIS_PORT }}
  REDIS_USER: ${{ secrets.REDIS_USER }} # usually "default"
  REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install redis-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      - name: Create JWT key file
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          chmod 600 server.key

      - name: Authenticate to Salesforce
        run: |
          sf auth jwt grant \
          --client-id ${{ secrets.SF_CONSUMER_KEY }} \
          --username ${{ secrets.SF_PROD_USERNAME }} \
          --jwt-key-file server.key \
          --instance-url ${{ secrets.SF_INSTANCE_URL }} \
          --alias github-action

      - name: Find changed Apex files (PR-only)
        id: find-files
        shell: bash
        run: |
          set -euo pipefail
      
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
      
          echo "PR BASE: $BASE"
          echo "PR HEAD: $HEAD"
      
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" | grep '\.cls$' || true)
      
          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No Apex changes found"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            printf "%s\n" "$CHANGED" > changed-files.txt
            echo "Changed Apex files:"
            cat changed-files.txt
          fi
      # -------------------------
      # QUEUE ONLY AROUND DEPLOY
      # -------------------------

      - name: Detect Redis TLS mode
        id: redis-mode
        shell: bash
        env:
          REDISCLI_AUTH: ${{ secrets.REDIS_PASSWORD }}
        run: |
          set -euo pipefail
      
          echo "Testing Redis connectivity..."
      
          # Try TLS first
          if redis-cli --tls --insecure -h "${{ secrets.REDIS_HOST }}" -p "${{ secrets.REDIS_PORT }}" --user "${{ secrets.REDIS_USER }}" PING 2>/dev/null | grep -q PONG; then
            echo "mode=TLS" >> $GITHUB_OUTPUT
            echo "Redis mode: TLS"
            exit 0
          fi
      
          # Fall back to NON-TLS
          if redis-cli -h "${{ secrets.REDIS_HOST }}" -p "${{ secrets.REDIS_PORT }}" --user "${{ secrets.REDIS_USER }}" PING 2>/dev/null | grep -q PONG; then
            echo "mode=PLAIN" >> $GITHUB_OUTPUT
            echo "Redis mode: PLAIN"
            exit 0
          fi
      
          echo "Could not connect to Redis using TLS or NON-TLS."
          exit 1
          
      - name: Acquire deploy slot (Redis PoC)
        if: steps.find-files.outputs.has_changes == 'true'
        shell: bash
        env:
          REDISCLI_AUTH: ${{ secrets.REDIS_PASSWORD }}
        run: |
          set -euo pipefail

          QUEUE_KEY="sf:deploy:queue:prod"
          LOCK_KEY="sf:deploy:lock:prod"
          HB_PREFIX="sf:deploy:hb:"
          LOCK_TTL_MS=60000
          HB_TTL_SEC=90
          SLEEP_SEC=8

          MY_ID="${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          MY_HB="${HB_PREFIX}${MY_ID}"

          r() {
            if [ "${{ steps.redis-mode.outputs.mode }}" = "TLS" ]; then
            redis-cli --tls --insecure -h "$REDIS_HOST" -p "$REDIS_PORT" --user "$REDIS_USER" "$@"
            else
            redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" --user "$REDIS_USER" "$@"
            fi
          }

          cleanup() {
            echo "Cleanup..."
            OWNER="$(r GET "$LOCK_KEY" || true)"
            if [ "${OWNER:-}" = "$MY_ID" ]; then r DEL "$LOCK_KEY" >/dev/null || true; fi
            r DEL "$MY_HB" >/dev/null || true
            r LREM "$QUEUE_KEY" 0 "$MY_ID" >/dev/null || true
          }
          trap cleanup EXIT

          echo "Enqueue $MY_ID"
          r SET "$MY_HB" "1" EX "$HB_TTL_SEC" >/dev/null
          r RPUSH "$QUEUE_KEY" "$MY_ID" >/dev/null

          while true; do
            HEAD="$(r LINDEX "$QUEUE_KEY" 0 || true)"
            LOCK_OWNER="$(r GET "$LOCK_KEY" || true)"

            # Pop stale head (no heartbeat) if it isn't holding the lock
            if [ -n "${HEAD:-}" ]; then
              HEAD_HB="$(r GET "${HB_PREFIX}${HEAD}" || true)"
              if [ "$HEAD" != "$MY_ID" ] && [ -z "${HEAD_HB:-}" ] && [ "${LOCK_OWNER:-}" != "$HEAD" ]; then
                echo "Stale head $HEAD; popping..."
                r LPOP "$QUEUE_KEY" >/dev/null || true
                continue
              fi
            fi

            if [ "$HEAD" = "$MY_ID" ]; then
              RES="$(r SET "$LOCK_KEY" "$MY_ID" NX PX "$LOCK_TTL_MS" || true)"
              if [ "${RES:-}" = "OK" ] || [ "${LOCK_OWNER:-}" = "$MY_ID" ]; then
                echo "✅ Got deploy slot"
                (
                  while true; do
                    CUR="$(r GET "$LOCK_KEY" || true)"
                    [ "$CUR" = "$MY_ID" ] || exit 0
                    r PEXPIRE "$LOCK_KEY" "$LOCK_TTL_MS" >/dev/null || true
                    r SET "$MY_HB" "1" EX "$HB_TTL_SEC" >/dev/null || true
                    sleep 20
                  done
                ) &
                echo $! > renewer.pid
                break
              fi
            fi

            r SET "$MY_HB" "1" EX "$HB_TTL_SEC" >/dev/null || true
            sleep "$SLEEP_SEC"
          done

      - name: Deploy PR Apex changes
        if: steps.find-files.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
      
          ARGS=()
          while IFS= read -r f; do
            [ -n "$f" ] && ARGS+=(--source-dir "$f")
          done < changed-files.txt
      
          echo "Deploying:"
          cat changed-files.txt
      
          sf project deploy start \
            "${ARGS[@]}" \
            --target-org github-action \
            --wait 30 \
            --test-level NoTestRun

      - name: Release deploy slot (Redis PoC)
        if: steps.find-files.outputs.has_changes == 'true'
        shell: bash
        env:
          REDISCLI_AUTH: ${{ secrets.REDIS_PASSWORD }}
        run: |
          set -euo pipefail

          QUEUE_KEY="sf:deploy:queue:prod"
          LOCK_KEY="sf:deploy:lock:prod"
          HB_PREFIX="sf:deploy:hb:"

          MY_ID="${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          MY_HB="${HB_PREFIX}${MY_ID}"

          r() {
            if [ "${{ steps.redis-mode.outputs.mode }}" = "TLS" ]; then
            redis-cli --tls --insecure -h "$REDIS_HOST" -p "$REDIS_PORT" --user "$REDIS_USER" "$@"
            else
            redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" --user "$REDIS_USER" "$@"
            fi
          }

          if [ -f renewer.pid ]; then
            kill "$(cat renewer.pid)" >/dev/null 2>&1 || true
            rm -f renewer.pid
          fi

          HEAD="$(r LINDEX "$QUEUE_KEY" 0 || true)"
          if [ "$HEAD" = "$MY_ID" ]; then
            r LPOP "$QUEUE_KEY" >/dev/null
          else
            r LREM "$QUEUE_KEY" 0 "$MY_ID" >/dev/null || true
          fi

          OWNER="$(r GET "$LOCK_KEY" || true)"
          if [ "$OWNER" = "$MY_ID" ]; then
            r DEL "$LOCK_KEY" >/dev/null
          fi

          r DEL "$MY_HB" >/dev/null || true
          echo "✅ Released deploy slot"

      - name: Cleanup files
        if: always()
        run: rm -f server.key changed-files.txt renewer.pid
