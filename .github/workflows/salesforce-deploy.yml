name: Deploy Apex
on:
  pull_request:
    types: [closed]
    branches: [dev]

# THIS LINE CREATES THE QUEUE
concurrency:
  group: salesforce-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
    
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
    
      - name: Install latest Salesforce CLI
        run: npm install -g @salesforce/cli@latest
    
      - name: Verify SFDX installation
        run: sf --version
    
      - name: Create JWT key file
        id: create-key
        run: |
          echo "Creating JWT key file..."
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          
          # Verify key file was created
          if [ -f "server.key" ]; then
            echo "✅ JWT key file created"
            ls -la server.key
          else
            echo "❌ Failed to create JWT key file"
            exit 1
          fi
    
      - name: Authenticate to Salesforce
        id: auth
        run: |
          echo "Starting Salesforce authentication..."
          
          # Print debug info (without exposing secrets)
          echo "Username: ${{ secrets.SF_USERNAME }}"
          echo "Instance URL: ${{ secrets.SF_INSTANCE_URL }}"
          echo "Consumer Key length: ${#SF_CONSUMER_KEY} chars"
          
          # Authenticate using JWT
          sf org login jwt \
            --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.SF_USERNAME }}" \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --alias prod-org \
            --set-default
          
          # Verify authentication was successful
          echo "✅ Authentication successful!"
          
          # List orgs to confirm
          echo "Connected orgs:"
          sf org list
    
      - name: Get changed Apex files
        id: get-changes
        run: |
          # Get the commit BEFORE the PR merge (parent of merge commit)
          BASE=$(git log --pretty=format:"%H" -1 ${{ github.event.pull_request.merge_commit_sha }}^)
          HEAD=${{ github.event.pull_request.merge_commit_sha }}
          
          echo "Comparing $BASE..$HEAD"
          
          # Get changed .cls files
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" | grep '\.cls$' || echo "")
          
          if [ -z "$CHANGED" ]; then
            echo "No Apex class changes found"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Changed Apex files:"
          echo "$CHANGED"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "changed_files=$CHANGED" >> $GITHUB_OUTPUT
    
      - name: Deploy changed Apex files
        if: steps.get-changes.outputs.has_changes == 'true'
        run: |
          echo "Starting Salesforce deployment..."
          
          # Get the changed files from previous step
          CHANGED_FILES="${{ steps.get-changes.outputs.changed_files }}"
          
          # Convert newlines to commas for SFDX
          COMMA_SEPARATED=$(echo "$CHANGED_FILES" | tr '\n' ',')
          
          # Remove trailing comma if exists
          COMMA_SEPARATED=${COMMA_SEPARATED%,}
          
          echo "Files to deploy: $COMMA_SEPARATED"
          
          # Deploy using the new SF command
          sf project deploy start \
            --source-dir "$COMMA_SEPARATED" \
            --target-org prod-org \
            --wait 30 \
            --verbose
          
          echo "✅ Deployment completed successfully!"
    
      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up temporary files..."
          rm -f server.key 2>/dev/null || true
