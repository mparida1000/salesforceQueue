name: Deploy Apex
on:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      # 1. This pauses the job so they run one-by-one
      - name: Wait for previous deployments
        uses: softprops/turnstyle@v1
        with:
          # This ensures it waits for ANY other run of "Deploy Apex"
          poll-interval-seconds: 10
          continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Salesforce CLI
        run: |
          npm install -g @salesforce/cli@latest
      
      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          sf auth jwt grant \
            --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
            --username "${{ secrets.SF_PROD_USERNAME }}" \
            --jwt-key-file server.key \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --alias github-action
          rm -f server.key

      - name: Find and deploy changed Apex files
        run: |
          # Use the EXACT merge commit from the PR event
          # This is the "secret sauce" that makes it work even if other PRs merged in the meantime
          HEAD=${{ github.event.pull_request.merge_commit_sha }}
          
          # This is your original logic for finding the base (parent)
          BASE=$(git log --pretty=format:"%H" -1 $HEAD^)
          
          echo "Base commit: $BASE"
          echo "Head commit: $HEAD"
          
          # Your original grep logic
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" | grep '\.cls$' || echo "")
          
          if [ -z "$CHANGED" ]; then
            echo "No Apex changes found"
            exit 0
          fi
          
          echo "Changed files:"
          echo "$CHANGED"
          
          # Deploying using your original command
          # Note: We use xargs to make sure the list is formatted correctly for the CLI
          sf project deploy start \
            --source-dir $(echo $CHANGED | tr '\n' ' ') \
            --target-org github-action \
            --wait 30 \
            --test-level NoTestRun
