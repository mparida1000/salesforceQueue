name: Deploy Apex
on:
  pull_request:
    types: [closed]
    branches: [dev]

# THIS LINE CREATES THE QUEUE
concurrency:
  group: salesforce-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get all history, not just latest
    
      - name: Install SFDX
        run: npm install -g sfdx-cli
    
      - name: Create JWT key file
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key
    
      - name: Authenticate to Salesforce
        run: sfdx auth:jwt:grant --clientid "${{ secrets.SF_CONSUMER_KEY }}" --jwtkeyfile server.key --username "${{ secrets.SF_USERNAME }}" --instanceurl "${{ secrets.SF_INSTANCE_URL }}"
    
      - name: Deploy changed Apex files
        run: |
          # Get the commit BEFORE the PR merge (parent of merge commit)
          BASE=$(git log --pretty=format:"%H" -1 ${{ github.event.pull_request.merge_commit_sha }}^)
          HEAD=${{ github.event.pull_request.merge_commit_sha }}
          
          echo "Comparing $BASE..$HEAD"
          
          # Get changed .cls files
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" | grep '\.cls$' || echo "")
          
          if [ -z "$CHANGED" ]; then
            echo "No Apex class changes found"
            exit 0
          fi
          
          echo "Changed Apex files:"
          echo "$CHANGED"
          
          # Deploy each file
          for file in $CHANGED; do
            echo "Deploying: $file"
            sfdx force:source:deploy \
              --sourcepath "$file" \
              --targetusername "${{ secrets.SF_USERNAME }}" \
              --wait 10
          done
