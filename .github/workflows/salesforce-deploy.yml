name: Deploy Apex
on:
  pull_request:
    types: [closed]
    branches: [dev]

env:
  SF_USERNAME: ${{ secrets.SF_PROD_USERNAME }}
  SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
  SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}

jobs:
  queue-check:
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.check.outputs.can_deploy }}
    steps:
      - name: Install GitHub CLI
        run: |
          type -p gh >/dev/null || curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y
      
      - name: Check for running deployments
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_ID: ${{ github.workflow }}
        run: |
          echo "Checking for running deployments..."
          
          # Wait up to 10 minutes for queue
          MAX_WAIT=600  # 10 minutes in seconds
          WAIT_INTERVAL=10
          total_wait=0
          
          while [ $total_wait -lt $MAX_WAIT ]; do
            # Get running workflow runs
            RUNNING_COUNT=$(gh run list --repo="${{ github.repository }}" --workflow="$WORKFLOW_ID" --status=in_progress --json status --jq 'length' 2>/dev/null || echo "0")
            
            if [ "$RUNNING_COUNT" -eq "0" ]; then
              echo "✅ No deployments running. Can proceed."
              echo "can_deploy=true" >> $GITHUB_OUTPUT
              break
            else
              echo "⏳ $RUNNING_COUNT deployment(s) in progress. Waiting $WAIT_INTERVAL seconds..."
              sleep $WAIT_INTERVAL
              total_wait=$((total_wait + WAIT_INTERVAL))
            fi
          done
          
          if [ $total_wait -ge $MAX_WAIT ]; then
            echo "❌ Timeout waiting for queue (10 minutes)"
            echo "can_deploy=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: queue-check
    if: needs.queue-check.outputs.can_deploy == 'true'
    runs-on: ubuntu-latest
    
    # JOB-LEVEL QUEUE - This is key!
    concurrency:
      group: salesforce-deploy-queue
      cancel-in-progress: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest
      
      - name: Create JWT key file
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          echo "JWT key created"
      
      - name: Authenticate to Salesforce
        run: |
          echo "Authenticating to Salesforce..."
          sf auth jwt grant \
            --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
            --username "${{ secrets.SF_PROD_USERNAME }}" \
            --jwt-key-file server.key \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --alias github-action
          
          echo "✅ Authentication successful!"
      
      - name: Find changed Apex files
        id: find-files
        run: |
          BASE=$(git log --pretty=format:"%H" -1 ${{ github.event.pull_request.merge_commit_sha }}^)
          HEAD=${{ github.event.pull_request.merge_commit_sha }}
          
          echo "Base commit: $BASE"
          echo "Head commit: $HEAD"
          
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" | grep '\.cls$' || echo "")
          
          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No Apex changes found"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            echo "$CHANGED"
            echo "$CHANGED" > changed-files.txt
          fi
      
      - name: Deploy changed files
        if: steps.find-files.outputs.has_changes == 'true'
        run: |
          echo "Starting deployment..."
          
          FILES=$(cat changed-files.txt)
          FILE_LIST=$(echo "$FILES" | tr '\n' ',' | sed 's/,$//')
          
          echo "Deploying files: $FILE_LIST"
          
          sf project deploy start \
            --source-dir "$FILE_LIST" \
            --target-org github-action \
            --wait 30 \
            --test-level NoTestRun
          
          echo "✅ Deployment completed!"
      
      - name: Cleanup
        if: always()
        run: rm -f server.key changed-files.txt
