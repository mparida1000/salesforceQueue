name: Deploy Apex
on:
  pull_request:
    types: [closed]
    branches: [dev]

# Important: We must give the GITHUB_TOKEN permission to read other runs
permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      # 1. THE STRICT QUEUE
      - name: Wait for previous deployments
        uses: softprops/turnstyle@v1
        with:
          # This 'same-branch-only' ensures it looks at all runs for 'dev'
          same-branch-only: true
          # How long to wait before giving up (in seconds)
          timeout-number: 3600 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Salesforce CLI
        run: npm install -g @salesforce/cli@latest
      
      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          sf auth jwt grant \
            --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
            --username "${{ secrets.SF_PROD_USERNAME }}" \
            --jwt-key-file server.key \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --alias github-action
          rm -f server.key

      - name: Find and deploy changed Apex files
        run: |
          SHA=${{ github.event.pull_request.merge_commit_sha }}
          CHANGED=$(git diff-tree --no-commit-id --name-only -r "$SHA" | grep '\.cls$' | xargs | sed 's/ /,/g' || echo "")
          
          if [ -z "$CHANGED" ]; then
            echo "No Apex changes found."
            exit 0
          fi
          
          sf project deploy start \
            --metadata "$CHANGED" \
            --target-org github-action \
            --wait 30 \
            --test-level NoTestRun
