name: Deploy Apex
on:
  pull_request:
    types: [closed]
    branches: [dev]

# NO workflow-level concurrency here

env:
  SF_USERNAME: ${{ secrets.SF_PROD_USERNAME }}
  SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
  SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}

jobs:
  queue-manager:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check-queue.outputs.should_run }}
    steps:
      - name: Check queue status
        id: check-queue
        uses: actions/github-script@v6
        with:
          script: |
            const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            
            // Check up to 5 minutes
            const MAX_CHECKS = 30; // 30 checks * 10 seconds = 5 minutes
            let checks = 0;
            
            while (checks < MAX_CHECKS) {
              checks++;
              
              // Get all in-progress runs of the deploy job
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: context.workflow,
                status: 'in_progress',
                per_page: 10
              });
              
              // Filter to only "deploy" job runs
              const deployRuns = runs.workflow_runs.filter(run => 
                run.name === 'Deploy Apex' || 
                (run.jobs && run.jobs.some(job => job.name === 'deploy'))
              );
              
              if (deployRuns.length === 0) {
                console.log('✅ No deployments in progress. Starting...');
                core.setOutput('should_run', 'true');
                return;
              }
              
              console.log(`⏳ ${deployRuns.length} deployment(s) in progress. Waiting 10 seconds... (check ${checks}/${MAX_CHECKS})`);
              await wait(10000); // Wait 10 seconds
            }
            
            console.log('❌ Timeout waiting for queue');
            core.setOutput('should_run', 'false');

  deploy:
    needs: queue-manager
    if: needs.queue-manager.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    
    # CRITICAL: Concurrency at JOB level only
    concurrency:
      group: salesforce-deploy-queue
      cancel-in-progress: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest
      
      - name: Create JWT key file
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          echo "JWT key created"
      
      - name: Authenticate to Salesforce
        run: |
          echo "Authenticating to Salesforce..."
          sf auth jwt grant \
            --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
            --username "${{ secrets.SF_PROD_USERNAME }}" \
            --jwt-key-file server.key \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --alias github-action
          
          echo "✅ Authentication successful!"
      
      - name: Find changed Apex files
        id: find-files
        run: |
          BASE=$(git log --pretty=format:"%H" -1 ${{ github.event.pull_request.merge_commit_sha }}^)
          HEAD=${{ github.event.pull_request.merge_commit_sha }}
          
          echo "Base commit: $BASE"
          echo "Head commit: $HEAD"
          
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" | grep '\.cls$' || echo "")
          
          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No Apex changes found"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            echo "$CHANGED"
            
            # Save to file
            echo "$CHANGED" > changed-files.txt
          fi
      
      - name: Deploy changed files
        if: steps.find-files.outputs.has_changes == 'true'
        run: |
          echo "Starting deployment..."
          
          # Read files from saved list
          FILES=$(cat changed-files.txt)
          
          # Convert to comma-separated list
          FILE_LIST=$(echo "$FILES" | tr '\n' ',')
          FILE_LIST=${FILE_LIST%,}
          
          echo "Deploying files: $FILE_LIST"
          
          sf project deploy start \
            --source-dir "$FILE_LIST" \
            --target-org github-action \
            --wait 30 \
            --test-level NoTestRun
          
          echo "✅ Deployment completed!"
      
      - name: Cleanup
        if: always()
        run: rm -f server.key changed-files.txt
