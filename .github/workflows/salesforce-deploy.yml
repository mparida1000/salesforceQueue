name: Deploy Apex
on:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      # 1. THE QUEUE MANAGER
      # This replaces the concurrency block. It will wait for previous runs to finish
      # instead of letting GitHub cancel this one.
      - name: Wait for previous deployments
        uses: softprops/turnstyle@v1
        with:
          poll-interval-seconds: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Salesforce CLI
        run: npm install -g @salesforce/cli@latest
      
      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          sf auth jwt grant \
            --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
            --username "${{ secrets.SF_PROD_USERNAME }}" \
            --jwt-key-file server.key \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --alias github-action
          rm -f server.key

      - name: Find and deploy changed Apex files
        run: |
          SHA=${{ github.event.pull_request.merge_commit_sha }}
          
          # Extract changed .cls files from this specific merge commit
          CHANGED=$(git diff-tree --no-commit-id --name-only -r "$SHA" | grep '\.cls$' | xargs | sed 's/ /,/g' || echo "")
          
          if [ -z "$CHANGED" ]; then
            echo "No Apex changes found in this merge."
            exit 0
          fi
          
          echo "Deploying files for PR #${{ github.event.pull_request.number }}: $CHANGED"
          
          sf project deploy start \
            --metadata "$CHANGED" \
            --target-org github-action \
            --wait 30 \
            --test-level NoTestRun
