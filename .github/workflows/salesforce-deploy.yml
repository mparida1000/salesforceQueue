# .github/workflows/salesforce.yml
name: Deploy Apex

on:
  pull_request:
    types: [closed]
    branches: [dev, test]

# QUEUE MAGIC HAPPENS HERE
concurrency:
  group: apex-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: salesforceactions/setup-sfdx@v4
      
      - name: Authenticate
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          sfdx auth:jwt:grant \
            --clientid "${{ secrets.SF_CONSUMER_KEY }}" \
            --jwtkeyfile server.key \
            --username "${{ secrets.SF_USERNAME }}" \
            --instanceurl "${{ secrets.SF_INSTANCE_URL }}"
      
      - name: Deploy changed Apex
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.merge_commit_sha }}
          
          # Create directory for changed files
          mkdir -p changed-apex
          
          # Find and copy changed .cls files
          git diff --name-only $BASE $HEAD | while read file; do
            if [[ $file == *.cls ]]; then
              mkdir -p "changed-apex/$(dirname "$file")"
              cp "$file" "changed-apex/$file"
            fi
          done
          
          # Deploy if we found files
          if [ -n "$(find changed-apex -name '*.cls')" ]; then
            echo "Deploying Apex changes..."
            sfdx force:source:deploy \
              --sourcepath changed-apex \
              --targetusername "${{ secrets.SF_USERNAME }}"
          else
            echo "No Apex changes to deploy"
          fi
