name: Deploy Apex
on:
  pull_request:
    types: [closed]
    branches: [dev]

# THIS LINE CREATES THE QUEUE
concurrency:
  group: salesforce-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    
      - name: Install SFDX
        run: npm install -g sfdx-cli
    
      - name: Create JWT key file
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key
    
      - name: Authenticate to Salesforce
        run: sfdx auth:jwt:grant --clientid "${{ secrets.SF_CONSUMER_KEY }}" --jwtkeyfile server.key --username "${{ secrets.SF_USERNAME }}" --instanceurl "${{ secrets.SF_INSTANCE_URL }}"
    
      - name: Deploy changed Apex files
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.merge_commit_sha }}
          CHANGED=$(git diff --name-only $BASE $HEAD | grep '\.cls$')
          if [ -n "$CHANGED" ]; then
            sfdx force:source:deploy --sourcepath "$CHANGED" --targetusername "${{ secrets.SF_USERNAME }}"
          fi
